<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WORK LESS. AUTOMATE MORE.</h1>
        <p>Transform your workflow with cutting-edge AI automation. Built for the future, designed for today.</p>
        <button style="background: #00ff88; color: black; border: none; padding: 15px 30px; border-radius: 5px; font-size: 1.1rem; cursor: pointer;">Get Started</button>

        <div class="stats">
            <div class="stat">
                <div class="stat-number">12K+</div>
                <div>Tasks Automated</div>
            </div>
            <div class="stat">
                <div class="stat-number">98%</div>
                <div>Accuracy Rate</div>
            </div>
            <div class="stat">
                <div class="stat-number">10K+</div>
                <div>Hours Saved</div>
            </div>
        </div>
    </div>
</body>
</html>
