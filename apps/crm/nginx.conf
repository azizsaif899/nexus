# ====================================================================
# Nginx Configuration for CRM Nxs
# Optimized for Google Cloud Run
# ====================================================================

server {
    # Listen on port 8080 (Cloud Run requirement)
    listen 8080;
    listen [::]:8080;
    
    server_name _;
    
    # Document root
    root /usr/share/nginx/html;
    index index.html;
    
    # Charset
    charset utf-8;
    
    # ====================================================================
    # Gzip Compression - تحسين الأداء
    # ====================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";
    
    # ====================================================================
    # Security Headers - الأمان
    # ====================================================================
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Content Security Policy (CSP) - adjust as needed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;
    
    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # ====================================================================
    # SPA Routing - توجيه React Router
    # ====================================================================
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # Disable caching for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # ====================================================================
    # Static Assets Caching - تخزين مؤقت للملفات الثابتة
    # ====================================================================
    
    # JavaScript and CSS files
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }
    
    # Media files
    location ~* \.(mp4|mp3|webm|ogg|avi|mov)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # JSON, XML, and other data files
    location ~* \.(json|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # ====================================================================
    # Health Check Endpoint - للمراقبة
    # ====================================================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # ====================================================================
    # Error Pages - صفحات الأخطاء
    # ====================================================================
    
    error_page 404 /index.html;
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ====================================================================
    # Deny Access to Hidden Files - منع الوصول للملفات المخفية
    # ====================================================================
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ====================================================================
    # Logging - السجلات
    # ====================================================================
    
    # Access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # ====================================================================
    # Performance Tuning - تحسين الأداء
    # ====================================================================
    
    # Enable sendfile
    sendfile on;
    
    # TCP options
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keepalive timeout
    keepalive_timeout 65;
    
    # Types hash
    types_hash_max_size 2048;
    
    # Server tokens (hide nginx version)
    server_tokens off;
    
    # Client settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
}
