# Google Cloud Build Configuration
steps:
  # Build CRM App
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']
    dir: 'apps/crm'
    
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'apps/crm'
    
  # Build Visual Automation App
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install', '--legacy-peer-deps']
    dir: 'apps/visual-automation'
    
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'apps/visual-automation'
    
  # Build API
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']
    dir: 'apps/api'
    
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'apps/api'
    
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nexus-ai', '.']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nexus-ai']
    
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'nexus-ai',
      '--image', 'gcr.io/$PROJECT_ID/nexus-ai',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

timeout: '1200s'