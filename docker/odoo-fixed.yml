version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nexus_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped

  odoo:
    image: odoo:17.0
    container_name: nexus_odoo
    depends_on:
      - postgres
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo123
      POSTGRES_DB: postgres
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo-addon:/mnt/extra-addons
    ports:
      - "8069:8069"
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data: